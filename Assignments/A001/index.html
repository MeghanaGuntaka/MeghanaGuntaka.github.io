<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix</title>
    <link rel="stylesheet" href="./netflix.css">
    <style>
        *{
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }
    </style>
</head>
<body>
    <div class="img">
        <div class="sign">
            <h1 style="color: red; cursor: pointer;">NETFLIX</h1>
            <div>
                <button>English</button>
                <button>Sign In</button>
            </div>
        </div>
        <div class="sign">
            
        </div>
       
        <div class="c1">
            <b>Unlimited movies, TV shows and more</b><br>
        </div>
        <div class="c2">
            Watch anywhere. Cancel anytime.<br><br>

                <input type="text" placeholder="Enter your Email" size="30" height="20px">
                <button type="submit">Get Started ></button>
            </form>
        </div>
    </div>
    <div class="hr"></div>
    <div class="content">
       <b><h1 class="content1">Enjoy on your TV </h1></b>
       <br>
       <p>Watch on smart TVs, PlayStation, Xbox, <br>
        Chromecast, Apple TV, Blu-ray players and more.</p>
        <div class="video">
            <video width="300" height="3200" controls autoplay muted>
                <source src ="/Images/video1.png">
            </video>
        </div>
    </div>
    <div class="hr"></div>
